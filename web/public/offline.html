<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOIS</title>
  <style>
    /* shown by the phone app (Capacitor) when MOIS can't be reached */
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; background: #FDFCFA; color: #111; text-align: center; padding: 24px; box-sizing: border-box; }
    @media (prefers-color-scheme: dark) { body { background: #1A1A19; color: #F6F4F1; } p { color: #B8B3AA; } }
    .logo { width: 56px; height: 56px; border-radius: 12px; background: #B7A57A; color: #2B2B2B; font-weight: 800; font-size: 28px;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { margin: 0 0 22px; color: #5C5750; font-size: 15px; }
    button { background: #B7A57A; color: #2B2B2B; border: 0; border-radius: 8px; padding: 12px 28px; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <div class="logo">M</div>
    <h1>Can't reach MOIS</h1>
    <p>Check the phone's internet, then try again.</p>
    <button type="button" onclick="location.href='https://mois.swahzitech.workers.dev/'">Try again</button>
  </div>
</body>
</html>

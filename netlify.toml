# Netlify: the web app lives in web/ (React + Vite)
[build]
  base    = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route is served by index.html (React Router)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# The service worker and app settings must always be checked for a new version
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
